```yaml
openapi: 3.0.3
info:
  title: Trading Game API
  version: 1.0.0
  description: |
    API for market data, trading, portfolio management and event triggering
    for the trading simulation game.
servers:
  - url: https://api.example.com/v1
    description: Production server
paths:
  /market:
    get:
      summary: Get latest market data for all instruments
      operationId: listMarketData
      tags:
        - Market
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: offset
          in: query
          description: Number of records to skip (for pagination)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: instrument_id
          in: query
          description: Filter by specific instrument (e.g., ticker)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of market data points
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketData'
                  total:
                    type: integer
                    description: Total number of records matching the query
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /stock/{symbol}:
    get:
      summary: Get the latest market data for a specific stock symbol
      operationId: getStockData
      tags:
        - Market
      parameters:
        - name: symbol
          in: path
          required: true
          description: Stock ticker symbol (instrument_id)
          schema:
            type: string
        - name: latest
          in: query
          required: false
          description: If true, returns the most recent data point only
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Market data for the requested symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketData'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /trade:
    post:
      summary: Execute a trade (buy or sell) within a portfolio
      operationId: executeTrade
      tags:
        - Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '201':
          description: Trade successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Business rule violation (e.g., insufficient funds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /portfolio:
    get:
      summary: Retrieve a player's portfolio overview
      operationId: getPortfolio
      tags:
        - Portfolio
      parameters:
        - name: player_id
          in: query
          required: true
          description: UUID of the player whose portfolio is requested
          schema:
            type: string
            format: uuid
        - name: portfolio_name
          in: query
          required: false
          description: Filter by portfolio name (if player has multiple)
          schema:
            type: string
      responses:
        '200':
          description: Portfolio data including holdings and total value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /event/trigger:
    post:
      summary: Trigger an in‑game event for a player (e.g., event participation, reward claim)
      operationId: triggerEvent
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTriggerRequest'
      responses:
        '200':
          description: Event processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTriggerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Event cannot be triggered (e.g., already finished)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    MarketData:
      type: object
      required:
        - instrument_id
        - price
        - volume
        - data_timestamp
      properties:
        market_data_id:
          type: integer
          format: int64
        instrument_id:
          type: string
          example: AAPL
        price:
          type: number
          format: double
        volume:
          type: integer
          format: int64
        bid_price:
          type: number
          format: double
          nullable: true
        ask_price:
          type: number
          format: double
          nullable: true
        data_timestamp:
          type: string
          format: date-time

    TradeRequest:
      type: object
      required:
        - portfolio_id
        - instrument_id
        - side
        - quantity
      properties:
        portfolio_id:
          type: string
          format: uuid
        instrument_id:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          format: double
          minimum: 0.00000001
        price:
          type: number
          format: double
          description: Optional limit price; if omitted, market price is used
          nullable: true
        fee:
          type: number
          format: double
          default: 0
        market_data_id:
          type: integer
          format: int64
          description: Reference to market_data used for audit
          nullable: true

    TradeResponse:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        instrument_id:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        executed_at:
          type: string
          format: date-time
        fee:
          type: number
          format: double
        market_data_id:
          type: integer
          format: int64
          nullable: true

    PortfolioResponse:
      type: object
      required:
        - portfolio_id
        - player_id
        - name
        - total_value
        - holdings
      properties:
        portfolio_id:
          type: string
          format: uuid
        player_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        total_value:
          type: number
          format: double
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'

    Holding:
      type: object
      required:
        - instrument_id
        - quantity
        - avg_price
      properties:
        instrument_id:
          type: string
        quantity:
          type: number
          format: double
        avg_price:
          type: number
          format: double
        last_updated:
          type: string
          format: date-time

    EventTriggerRequest:
      type: object
      required:
        - player_id
        - event_id
        - action
      properties:
        player_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        action:
          type: string
          description: The action the player performs, e.g., "join", "claim_reward"
          enum: [join, claim_reward]
        metadata:
          type: object
          additionalProperties: true
          description: Optional extra data for the event

    EventTriggerResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [joined, reward_claimed, already_claimed, not_allowed]
        points_earned:
          type: integer
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
```