**GitHub Actions Workflow – `.github/workflows/ci.yml`**

```yaml
# .github/workflows/ci.yml
name: CI/CD & Staging Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Docker image name (adjust to your registry)
  IMAGE_NAME: ghcr.io/${{ github.repository }}/fintech-game
  # Docker tag for staging
  STAGING_TAG: staging-${{ github.sha }}

jobs:
  # -------------------------------------------------
  # 1️⃣ Lint & Test
  # -------------------------------------------------
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, node]   # python = backend, node = front‑end / utils
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        if: matrix.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------- Python Lint & Tests ----------
      - name: Install Python deps
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt   # includes pytest, flake8

      - name: Run Python Lint
        if: matrix.language == 'python'
        run: |
          flake8 .
          # optional: mypy for static typing
          mypy .

      - name: Run Python Unit Tests
        if: matrix.language == 'python'
        run: |
          pytest --junitxml=pytest-report.xml

      # ---------- Node (JS/TS) Lint & Tests ----------
      - name: Install Node deps
        if: matrix.language == 'node'
        run: npm ci

      - name: Run ESLint
        if: matrix.language == 'node'
        run: npx eslint . --ext .js,.jsx,.ts,.tsx

      - name: Run Jest Tests
        if: matrix.language == 'node'
        run: npx jest --ci --reporters=default --reporters=junit

      # ---------- Upload test reports ----------
      - name: Upload pytest report
        if: matrix.language == 'python'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Upload jest report
        if: matrix.language == 'node'
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: junit.xml

  # -------------------------------------------------
  # 2️⃣ Build Docker Image
  # -------------------------------------------------
  build:
    name: Build & Push Docker Image
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

  # -------------------------------------------------
  # 3️⃣ Deploy Schema & API to Staging Docker Container
  # -------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.api.fintechgame.com
    steps:
      - name: Checkout code (needed for compose files)
        uses: actions/checkout@v4

      - name: Pull latest image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}

      # ---- Run DB migrations (schema) ----
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          # Assuming alembic (Python) or a generic migration script
          docker run --rm \
            -e DATABASE_URL="${DATABASE_URL}" \
            ${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }} \
            /app/scripts/migrate.sh

      # ---- Start / Update staging container ----
      - name: Deploy Staging Container (Docker Compose)
        env:
          IMAGE_TAG: ${{ env.STAGING_TAG }}
          POSTGRES_URL: ${{ secrets.STAGING_DATABASE_URL }}
          KAFKA_BOOTSTRAP: ${{ secrets.STAGING_KAFKA_BOOTSTRAP }}
        run: |
          # Use docker compose to replace the service with the new image
          cat > docker-compose.staging.yml <<EOF
          version: "3.9"
          services:
            api:
              image: ${{ env.IMAGE_NAME }}:\${IMAGE_TAG}
              restart: always
              environment:
                - DATABASE_URL=\${POSTGRES_URL}
                - KAFKA_BOOTSTRAP=\${KAFKA_BOOTSTRAP}
                - ENV=staging
              ports:
                - "8080:8080"
          EOF
          docker compose -f docker-compose.staging.yml up -d --remove-orphans

      # ---- Health check ------------------------------------------------
      - name: Wait for API health
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.api.fintechgame.com/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ API is healthy"
              exit 0
            fi
            echo "⏳ waiting for API... (attempt $i)"
            sleep 5
          done
          echo "❌ API did not become healthy"
          exit 1

      # ---- Notify Discord ------------------------------------------------
      - name: Report success to Discord
        if: success()
        uses: peter-evans/discord-webhook@v2
        with:
          webhook-url: ${{ secrets.DISCORD_CI_WEBHOOK }}
          content: |
            🎉 **CI/CD Pipeline** – Staging deployment succeeded.
            • Commit: `${{ github.sha }}`
            • Image: `${{ env.IMAGE_NAME }}:${{ env.STAGING_TAG }}`
            • Environment: **staging**
            • URL: https://staging.api.fintechgame.com

      - name: Report failure to Discord
        if: failure()
        uses: peter-evans/discord-webhook@v2
        with:
          webhook-url: ${{ secrets.DISCORD_CI_WEBHOOK }}
          content: |
            ❗ **CI/CD Pipeline** – Staging deployment failed.
            • Commit: `${{ github.sha }}`
            • Check the GitHub Actions run for details.

  # -------------------------------------------------
  # 4️⃣ (Optional) Clean-up old images
  # -------------------------------------------------
  purge-old-images:
    name: Purge old images (keep last 30)
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Delete old tags (ghcr.io)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # List tags, sort by created date, keep newest 30
          REPO="${{ github.repository }}"
          tags=$(gh api -H "Accept: application/vnd.github+json" \
                /orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions \
                --jq '.[] | "\(.id) \(.metadata.container.tags[0]) \(.created_at)"' \
                | sort -k3 -r | awk 'NR>30 {print $1}')
          for id in $tags; do
            echo "Deleting image version $id"
            gh api -X DELETE \
              /orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions/$id
          done
```

