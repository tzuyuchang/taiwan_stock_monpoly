**Documentation – `cloud_sync.md`**

```markdown
# Cloud Sync & Discord Webhook Integration

This document explains how the FinTech Gaming Platform synchronises artefacts with the cloud
and how Discord web‑hooks are used for CI/CD notifications and in‑application event reporting.

---

## 1️⃣ Why Cloud Sync?

| Situation | What is synced | Where it lives | Reason |
|-----------|----------------|----------------|--------|
| **CI artefacts (Docker images, schema migrations)** | Docker image (`ghcr.io/<repo>/fintech-game`), migration scripts | GitHub Container Registry (GHCR) & S3 bucket `fintech‑game‑ci‑artifacts` | Centralised immutable store for every build – enables roll‑backs & audit. |
| **Runtime configuration & secrets** | Vault policies, environment files (`.env.staging`) | HashiCorp Vault (cloud‑hosted) | Secrets never touch the repo; Vault provides short‑lived tokens for containers. |
| **Database backups** | PostgreSQL/TimescaleDB point‑in‑time snapshots | Amazon S3 (or GCS) with WORM bucket | Meets PCI‑DSS & GDPR retention, enables disaster recovery. |
| **Game assets & cards** | JSON definitions of event cards, avatar images, UI bundles | S3 (public CDN‑enabled) | Fast edge delivery for mobile/web clients; versioned objects allow hot‑swap. |

All sync operations are **idempotent** and performed via CI jobs or scheduled Kubernetes CronJobs,
so the same code can run repeatedly without side‑effects.

---

## 2️⃣ Discord Webhook – Where & How It Is Used

### 2.1 CI/CD Status Reporting
* **When:** After every GitHub Actions run (success or failure) in the `ci.yml` workflow.
* **Where:** A dedicated Discord channel `#ci-cd‑notifications` for the engineering team.
* **Payload:** A compact markdown message (see `ci.yml` step *Report success to Discord*).  
  Example:
  ```
  🎉 CI/CD Pipeline – Staging deployment succeeded.
  • Commit: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  • Image: ghcr.io/org/repo/fintech-game:staging-3fa85f64...
  • Environment: staging
  • URL: https://staging.api.fintechgame.com
  ```

### 2.2 In‑App Event Alerts (optional future feature)
The platform can push **real‑time game events** (e.g., “User X earned a Legendary card”) to a Discord
webhook that feeds a community channel. This is useful for community engagement and
monitoring abnormal spikes (e.g., many “fee‑penalty” cards being drawn).

* **Endpoint**: `https://discord.com/api/webhooks/<id>/<token>` stored in Vault as `discord/event-webhook`.
* **Message format** (JSON -> Discord embeds):
  ```json
  {
    "username": "FinTechGame Bot",
    "embeds": [
      {
        "title": "🎴 Card Drawn",
        "description": "**User** <@{{discord_id}}> drew **Turbo Trader** (RARE).",
        "color": 65280,
        "timestamp": "{{ISO8601}}"
      }
    ]
  }
  ```
* **Implementation** (Node/TS example):
  ```ts
  import fetch from 'node-fetch';
  import { getSecret } from './vault';

  export async function notifyCardDraw(userId: string, card: Card) {
    const webhook = await getSecret('discord/event-webhook');
    const payload = {
      username: 'FinTechGame Bot',
      embeds: [
        {
          title: '🎴 Card Drawn',
          description: `**User** <@${userId}> drew **${card.name}** (${card.rarity}).`,
          color: 0x00ff00,
          timestamp: new Date().toISOString(),
        },
      ],
    };
    await fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  }
  ```

### 2.3 Security & Rate‑Limiting
* Webhook URLs are stored as **read‑only secrets** in Vault; only the `ci` and `event‑bot`
  service accounts have permission to read them.
* Discord limits inbound webhook posts to **5 requests per second** per channel.  
  All notification code uses a tiny **p‑queue** (max concurrency = 4) to stay under the limit.

---

## 3️⃣ Cloud Sync Implementation Details

### 3.1 Docker Image Sync (CI)
The `docker/build-push-action` step builds the image locally and pushes **two tags**:

| Tag | Purpose |
|-----|---------|
| `latest` | Points to the most recent successful main‑branch build – used by production roll‑outs. |
| `staging‑<sha>` | Immutable reference for the staging deployment of the current commit. |
| **Why two tags?** Allows a fast “promote to prod” by retagging `staging‑<sha>` → `latest` without rebuilding.

All pushes are authenticated with the `GITHUB_TOKEN` (automatically scoped to the repo).

### 3.2 Database Schema Migration Sync
* Migration scripts live in `db/migrations/` and are applied inside the staging container
  (`/app/scripts/migrate.sh`).  
* The CI job runs the script **after** pulling the new image but **before** starting the service,
  guaranteeing the database schema matches the code.
* The same script is used by the nightly backup job when restoring a snapshot, keeping migrations
  source‑controlled.

### 3.3 S3 Asset Sync (Game Cards & UI bundles)
A separate GitHub Action `sync-assets.yml` (triggered on `push` to `main` or `release/*`) runs:

```yaml
- name: Sync assets to S3
  uses: jakejarvis/s3-sync-action@v0.5.1
  with:
    args: --delete --acl public-read
  env:
    AWS_S3_BUCKET: ${{ secrets.ASSET_BUCKET }}
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    SOURCE_DIR: ./assets/
```

* The `--delete` flag mirrors the bucket so removed assets are automatically cleaned.
* Files are versioned with a `Cache‑Control: max‑age=31536000, immutable` header, enabling CDN edge caching.
* The CDN (CloudFront) invalidates the `/cards/*` path on each deployment using the
  `aws cloudfront create-invalidation` CLI command (wrapped inside the same action).

### 3.4 Backup & Restore Sync (PostgreSQL + TimescaleDB)

| Step | Cron (UTC) | Action |
|------|------------|--------|
| **Backup** | `04:00` | `pg_dumpall` → compress → upload to `s3://fintech‑game‑backups/<date>/db.dump.gz` |
| **Retention** | daily | Lambda checks bucket, keeps 30 days, moves older objects to Glacier. |
| **Restore (manual)** | – | Pull from S3, `pg_restore` into a new DB instance, run migrations again. |

All backup jobs write a small **manifest** (`backup‑manifest.json`) containing SHA of the code that
produced the dump. This ties a backup to a specific schema version for auditability.

---

## 4️⃣ Operational Checklist (what to verify after each pipeline run)

1. **Docker Registry**
   - Image with tag `staging‑<sha>` exists.
   - `latest` points to the most recent stable main‑branch image.

2. **Database**
   - `docker exec <container> /app/scripts/migrate.sh` completed with exit 0.
   - `SELECT version FROM schema_migrations` matches the latest migration file.

3. **Staging Service**
   - Health endpoint (`/health`) returns `200`.
   - Swagger/OpenAPI is reachable (`/docs`).

4. **Discord Notification**
   - A message appears in `#ci-cd‑notifications`.
   - Content matches the payload defined in the workflow.

5. **S3 Asset Sync**
   - New card JSON files are present under `s3://fintech‑game‑assets/cards/`.
   - CloudFront invalidation for `/cards/*` succeeded (check AWS console for status).

6. **Backup**
   - Latest backup file size > 0 and manifest SHA matches current commit.
   - Retention policy has not deleted the last 7 days.

7. **Monitoring**
   - Prometheus `ci_deploy_success` metric increments.
   - Alertmanager has *no* firing alerts for the pipeline.

---

## 5️⃣ Troubleshooting Tips

| Symptom | Likely cause | Fix |
|---------|--------------|-----|
| Discord webhook returns `404` | Wrong webhook URL (expired or deleted) | Re‑create webhook in Discord → store new URL in Vault (`secret/discord/ci-webhook`). |
| Staging container fails health check | Migration crashed / DB not reachable | Inspect container logs (`docker logs <container>`), verify `STAGING_DATABASE_URL` secret, re‑run migration manually. |
| Asset not updated on client | CloudFront cache still serving old version | Run `aws cloudfront create-invalidation --paths "/cards/*"` manually or wait for TTL expiry. |
| Image not found in GHCR | `GITHUB_TOKEN` missing `write:packages` scope | Ensure the token is the default `GITHUB_TOKEN` (auto‑scoped) or use a personal token with `write:packages`. |
| Backup job missing files | S3 IAM policy denies `PutObject` | Update IAM role attached to the GitHub Actions runner to include `s3:PutObject` on the backup bucket. |

---

## 6️⃣ Future Enhancements

| Feature | Description | Impact |
|---------|-------------|--------|
| **GitOps deployment** | Use ArgoCD / Flux to watch the `staging‑<sha>` tag and automatically roll the Kubernetes deployment. | Reduces manual compose steps, full Git‑driven delivery. |
| **Multi‑region image replication** | Replicate Docker images to AWS ECR (us‑east‑1, eu‑west‑1) for faster pull in distributed clusters. | Lowers latency for global staging environments. |
| **Event‑driven webhook batcher** | Buffer in‑app Discord event messages (card draws, leaderboard wins) and send them in batches of 5/min to respect Discord limits. | Improves reliability under bursty traffic. |
| **Secure secret rotation** | Integrate Vault’s `auto‑renew` for AWS credentials used by CI, so they rotate every 12 h automatically. | Aligns with PCI‑DSS secret‑management best practices. |

---

### TL;DR

* **CI workflow** (`ci.yml`) lints, tests, builds a Docker image, pushes it to GHCR, runs DB migrations and deploys a staging container.
* **Discord webhook** is used for CI status (and optionally for in‑app game events) – the webhook URL lives in Vault, and the workflow posts a formatted markdown message.
* **Cloud sync** covers Docker images, DB schema, static game assets, and daily backups, all stored in cloud services (GHCR, S3, Vault) and kept in sync via idempotent CI steps and cron jobs.

